name: agentcfg

# The fork's own checks for agentcfg: the library, its command and the
# Syncthing service that runs it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal/agentcfg cmd/agentcfg lib/agentcfg)"
      - run: go vet ./internal/agentcfg/... ./cmd/agentcfg/ ./lib/agentcfg/
      - run: go test ./internal/agentcfg/... ./cmd/agentcfg/ ./lib/agentcfg/ ./lib/config/
