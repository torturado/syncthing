# aimery runs long training jobs; keep the sandbox relaxed.
sandbox_mode = "workspace-write"

[mcp_servers.search]
url = "https://search.example.com/mcp"
env_http_headers = { "X-API-Key" = "SEARCH_API_KEY" }

[mcp_servers.registry]
url = "https://registry.example.ts.net/mcp"

[projects."/home/user/models"]
trust_level = "trusted"
